Hei,sans-serif" font-size="20" font-weight="400" fill="#213248">车控网关 / 模拟工具</text><text x="1140.0" y="495.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">独立校验 + 幂等执行</text><rect x="1380" y="420" width="280" height="110" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1520.0" y="465.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">可信执行回执</text><text x="1520.0" y="495.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">成功 / 失败 / 状态未知</text><rect x="350" y="700" width="340" height="110" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="520.0" y="745.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">统一供应商适配器</text><text x="520.0" y="775.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">超时 / 错误 / 结果归一化</text><rect x="830" y="700" width="410" height="110" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="1035.0" y="745.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">阿里云 AI 安全护栏</text><text x="1035.0" y="775.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">MultiModalGuard（先联调）</text><rect x="1380" y="700" width="280" height="110" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1520.0" y="745.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">策略与观测</text><text x="1520.0" y="775.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">策略版本 / 脱敏日志 / 指标</text><text x="54" y="144.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">三个关口各有职责：内容审核不能替代车控授权与车辆状态判断。</text><text x="1004" y="575.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">执行回执经检查后回到 Agent，再生成并审核播报。</text><text x="1004" y="603.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">以真实结果说话，执行失败时不能宣称“已完成”。</text><text x="54" y="600.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">拦截 / 故障：不启动或停止生成；清待播队列。</text><text x="54" y="628.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">使用本地已评审代答，不透出未审原文。</text><text x="54" y="941.5" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">实线：业务主流程    虚线：检测与观测调用    紫色：护栏    黄色：支撑模块    绿色：已审内容 / 可信结果    灰色：供应商</text></svg>