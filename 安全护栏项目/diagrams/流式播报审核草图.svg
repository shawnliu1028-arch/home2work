<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1000" viewBox="0 0 1740 1000" role="img" aria-label="流式播报｜先缓存，审核通过后释放"><rect width="100%" height="100%" fill="white"/><text x="54" y="64.5" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#213248">流式播报｜先缓存，审核通过后释放</text><text x="54" y="106.5" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">模型持续生成；TTS 只接收已通过的连续片段。    /    第一版同轮审核串行 · 设计建议</text><polyline points="290,280 380,280" fill="none" stroke="#536477" stroke-width="2" /><polygon points="380,280 368.0,275.0 368.0,285.0" fill="#536477"/><polyline points="660,280 750,280" fill="none" stroke="#536477" stroke-width="2" /><polygon points="750,280 738.0,275.0 738.0,285.0" fill="#536477"/><polyline points="1030,280 1130,280" fill="none" stroke="#536477" stroke-width="2" /><polygon points="1130,280 1118.0,275.0 1118.0,285.0" fill="#536477"/><text x="1080.0" y="276.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#536477">通过</text><polyline points="1390,280 1480,280" fill="none" stroke="#536477" stroke-width="2" /><polygon points="1480,280 1468.0,275.0 1468.0,285.0" fill="#536477"/><polyline points="890,340 890,560" fill="none" stroke="#b85450" stroke-width="2" /><polygon points="890,560 895.0,548.0 885.0,548.0" fill="#b85450"/><text x="802.0" y="446.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#b85450">拦截 / 超时 / 异常</text><polyline points="360,615 750,615" fill="none" stroke="#b85450" stroke-width="2" /><polygon points="750,615 738.0,610.0 738.0,620.0" fill="#b85450"/><text x="555.0" y="611.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#b85450">取消</text><polyline points="1130,615 1585,615 1585,340" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="8 6"/><polygon points="1585,340 1580.0,352.0 1590.0,352.0" fill="#b85450"/><text x="1357.5" y="611.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#b85450">清待播 / 停止后续</text><rect x="50" y="220" width="240" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="170.0" y="270.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">模型流式增量</text><text x="170.0" y="300.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">每轮生成独立标识</text><rect x="380" y="220" width="280" height="120" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="520.0" y="255.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">私有缓冲 / 组段</text><text x="520.0" y="285.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">自然句候选 + 长度上限</text><text x="520.0" y="315.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">尾段同样送检</text><rect x="750" y="220" width="280" height="120" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="890.0" y="255.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">阿里审核 + 本地策略</text><text x="890.0" y="285.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">必要上下文 / 有限超时</text><text x="890.0" y="315.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">未知结果不放行</text><rect x="1130" y="220" width="260" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1260.0" y="255.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">已审核队列</text><text x="1260.0" y="285.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">前序通过才释放</text><text x="1260.0" y="315.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">旧轮结果丢弃</text><rect x="1480" y="220" width="210" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1585.0" y="270.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">TTS / 屏幕</text><text x="1585.0" y="300.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">按序播放与显示</text><rect x="50" y="560" width="310" height="110" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="205.0" y="605.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">用户打断 / 新轮次</text><text x="205.0" y="635.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">取消旧轮所有待处理任务</text><rect x="750" y="560" width="380" height="110" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="940.0" y="590.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">停止该轮</text><text x="940.0" y="620.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">取消生成 / 清文本与音频队列</text><text x="940.0" y="650.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#213248">故障用代答；用户打断则静默</text><text x="54" y="161.5" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">禁止把原始 token 直接送进播报队列。每片记录 turn_id / generation_id / seq；取消优先于迟到结果。</text><text x="54" y="406.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">先做整段审核基线，再对照验证分段模式。</text><text x="54" y="434.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">审核速度落后时有界缓存并暂停/结束生成；</text><text x="54" y="462.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">不能为减少等待而绕过护栏。</text><text x="1154" y="746.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">新服务：chatId / done 需按契约验证。</text><text x="1154" y="774.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">上下文窗口、重试去重、开通权限待确认。</text><text x="1154" y="802.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">新旧产品的 session 字段不能混用。</text><text x="54" y="795.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">残余风险：已经播放的声音无法撤回；后续内容可能改变前文语义。</text><text x="54" y="823.0" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">跨片风险与长窗口不足要测试，必要场景改为整段通过后播报。</text><text x="54" y="941.5" text-anchor="start" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#596b80">蓝色：生成    黄色：待审缓冲    紫色：审核    绿色：通过后释放    红色：停止与清理    灰色：外部事件</text></svg>